<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Emirates Audience Atlas</title>
<meta name="description" content="An interactive map of the 1,200 Instagram accounts most followed by 1,375 people, grouped into 6 territories. By Bad Brain.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Bad Brain">
<meta property="og:title" content="Emirates Audience Atlas">
<meta property="og:description" content="An interactive map of the 1,200 Instagram accounts most followed by 1,375 people, grouped into 6 territories. By Bad Brain.">
<meta property="og:url" content="https://badbrain.media/atlas/emirates">
<meta property="og:image" content="https://badbrain.media/opengraph-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>@font-face{font-family:"Space Grotesk";font-weight:500 700;font-display:swap;src:url("/fonts/SpaceGrotesk-Latin.woff2") format("woff2")}@font-face{font-family:"Manrope";font-weight:400 700;font-display:swap;src:url("/fonts/Manrope-Latin.woff2") format("woff2")}@font-face{font-family:"JetBrains Mono";font-weight:400 600;font-display:swap;src:url("/fonts/JetBrainsMono-Latin.woff2") format("woff2")}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    color-scheme: dark;
    --void:        #05060A;
    --void-2:      #0A0E15;
    --panel:       rgba(13,17,25,0.82);
    --panel-solid: #0D1119;
    --hair:        rgba(199,215,224,0.14);
    --hair-strong: rgba(199,215,224,0.30);
    --ink:         #F1F4F6;
    --silver:      #C7D7E0;
    --silver-dim:  #90A0AC;
    --silver-faint:#5B6670;
    --c0: #2F8FE0; /* Pop & Celebrity Culture */
    --c1: #1D9E63; /* UK Streetwear & Roads Culture */
    --c2: #C17E12; /* US Hip-Hop & Basketball */
    --c3: #A24BA6; /* The Fashion Canon */
    --c4: #D6455A; /* Football Mainstream */
    --c5: #6D5AD6; /* F1 & Machines */
    --radius: 12px;
    --header-h: 130px;
    --font-display: "Space Grotesk", "Arial Narrow", sans-serif;
    --font-body: "Manrope", -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--void);
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
    position: fixed;
    inset: 0;
    -webkit-user-select:none; user-select:none;
  }
  button, input{ font-family: inherit; }
  button{ cursor:pointer; }
  a{ color: inherit; }

  :focus-visible{ outline: 2px solid var(--silver); outline-offset: 2px; border-radius: 4px; }

  #stage{ position:absolute; inset:0; }
  canvas{ position:absolute; inset:0; display:block; touch-action:none; }
  #bg-canvas{ z-index:0; }
  #atlas-canvas{ z-index:1; cursor: grab; }
  #atlas-canvas.dragging{ cursor: grabbing; }

  /* ---------- shared panel look ---------- */
  .glass{
    background: var(--panel);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid var(--hair);
    border-radius: var(--radius);
  }

  /* ---------- header / brand ---------- */
  #hud-top{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:16px;
    padding: 18px 20px 34px;
    pointer-events:none;
    z-index:5;
    background: linear-gradient(to bottom, rgba(5,6,10,0.62) 0%, rgba(5,6,10,0.34) 55%, rgba(5,6,10,0) 100%);
  }
  #brand{
    display:flex; align-items:center; gap:12px;
    pointer-events:auto;
  }
  #brand img{ height:16px; width:auto; display:block; opacity:0.92; }
  #brand-text{ display:flex; flex-direction:column; gap:3px; }
  .kicker{
    font-family: var(--font-display); font-weight:700; font-size:10.5px;
    letter-spacing: 2.2px; color: var(--silver); text-transform:uppercase;
  }
  #title-row{ display:flex; align-items:baseline; gap:10px; }
  h1{
    margin:0; font-family: var(--font-display); font-weight:700;
    font-size: clamp(20px, 3vw, 30px); letter-spacing:-0.5px; color: var(--ink);
  }
  #stat-line{
    font-family: var(--font-mono); font-size:11px; color: var(--silver-dim);
    letter-spacing: 0.2px; font-variant-numeric: tabular-nums;
  }

  #top-right-controls{
    display:flex; flex-direction:column; align-items:flex-end; gap:10px;
    pointer-events:auto;
  }

  /* ---------- search ---------- */
  #search-wrap{ position:relative; width: min(280px, 44vw); }
  #search{
    width:100%; padding:9px 14px 9px 34px;
    background: var(--panel); border:1px solid var(--hair); border-radius: 10px;
    color: var(--ink); font-size:13px; font-family: var(--font-body);
  }
  #search::placeholder{ color: var(--silver-faint); }
  #search-wrap svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); pointer-events:none; opacity:0.55; }
  #search-results{
    position:absolute; top:calc(100% + 6px); left:0; right:0;
    max-height: 320px; overflow-y:auto;
    display:none; z-index:20;
    padding:6px;
  }
  #search-results.open{ display:block; }
  .result-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:8px 10px; border-radius:8px; font-size:13px;
    background:none; border:none; width:100%; text-align:left; color:var(--ink);
  }
  .result-row:hover, .result-row:focus-visible{ background: rgba(199,215,224,0.08); }
  .result-dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .result-name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; }
  .result-pct{ font-family: var(--font-mono); color: var(--silver-dim); font-size:11.5px; font-variant-numeric: tabular-nums; }

  /* ---------- zoom controls ---------- */
  #zoom-controls{ display:flex; flex-direction:column; gap:1px; border-radius:10px; overflow:hidden; }
  #zoom-controls button{
    width:34px; height:34px; border:none; background: var(--panel);
    border-bottom: 1px solid var(--hair); color: var(--silver);
    font-size:16px; display:flex; align-items:center; justify-content:center;
  }
  #zoom-controls button:last-child{ border-bottom:none; }
  #zoom-controls button:hover{ background: rgba(199,215,224,0.08); color: var(--ink); }
  #reset-view{
    display:flex; align-items:center; gap:6px;
    padding:7px 12px; border:1px solid var(--hair); background: var(--panel);
    border-radius:10px; color: var(--silver-dim); font-size:11.5px;
    font-family: var(--font-mono); letter-spacing:0.3px;
  }
  #reset-view:hover{ color: var(--ink); border-color: var(--hair-strong); }

  /* ---------- legend (bottom-left desktop / drawer mobile) ---------- */
  #legend{
    position:absolute; left:20px; bottom:20px; z-index:5;
    width: 252px; padding:14px;
    display:flex; flex-direction:column; gap:10px;
    pointer-events:auto;
  }
  #legend-head{ display:flex; align-items:center; justify-content:space-between; }
  #legend-head span{
    font-family: var(--font-display); font-weight:700; font-size:10.5px;
    letter-spacing:1.8px; text-transform:uppercase; color: var(--silver-dim);
  }
  #legend-all{
    font-size:10.5px; font-family: var(--font-mono); color: var(--silver-dim);
    background:none; border:none; text-decoration: underline; text-underline-offset:2px;
  }
  #legend-all:hover{ color: var(--ink); }
  .legend-item{ display:flex; align-items:center; gap:2px; }
  .legend-row{
    display:flex; align-items:center; gap:9px; flex:1;
    background:none; border:none; padding:5px 4px; border-radius:7px;
    width:100%; text-align:left;
  }
  .legend-row:hover{ background: rgba(199,215,224,0.06); }
  .legend-dot{ width:10px; height:10px; border-radius:50%; flex:none; box-shadow: 0 0 6px 0 currentColor; }
  .legend-label{ flex:1; font-size:12.5px; color: var(--ink); font-weight:500; }
  .legend-count{ font-family: var(--font-mono); font-size:10.5px; color: var(--silver-faint); font-variant-numeric: tabular-nums; }
  .legend-row.dim .legend-label{ color: var(--silver-faint); }
  .legend-row.dim .legend-dot{ opacity:0.28; box-shadow:none; }
  .legend-row.dim .legend-count{ opacity:0.5; }
  .legend-locate{
    flex:none; width:26px; height:26px; border-radius:7px; border:none; background:none;
    color: var(--silver-faint); display:flex; align-items:center; justify-content:center;
  }
  .legend-locate:hover{ background: rgba(199,215,224,0.08); color: var(--silver); }

  /* ---------- brand watch panel ---------- */
  #brandwatch{
    position:absolute; right:20px; bottom:20px; z-index:5;
    width: 268px; padding:14px;
    pointer-events:auto;
  }
  #bw-head{
    font-family: var(--font-display); font-weight:700; font-size:10.5px;
    letter-spacing:1.8px; text-transform:uppercase; color: var(--silver-dim);
    margin-bottom:10px;
  }
  .bw-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:6px 4px; border-radius:7px; background:none; border:none; width:100%;
  }
  .bw-row.clickable:hover{ background: rgba(199,215,224,0.06); }
  .bw-name{ font-size:12.5px; font-weight:600; color: var(--ink); }
  .bw-sub{ font-size:10px; color: var(--silver-faint); margin-top:1px; }
  .bw-pct{ font-family: var(--font-mono); font-size:12.5px; font-variant-numeric: tabular-nums; }
  .bw-pct.zero{ color: var(--silver-faint); }
  .bw-left{ text-align:left; }

  /* ---------- tooltip ---------- */
  #tooltip{
    position:absolute; z-index:8; pointer-events:none;
    padding:6px 10px; border-radius:7px;
    font-size:12px; white-space:nowrap; display:none;
    transform: translate(-50%, -130%);
  }
  #tooltip b{ font-weight:600; }
  #tooltip span{ color: var(--silver-dim); font-family: var(--font-mono); font-size:11px; margin-left:6px; }

  /* ---------- detail panel (dossier) ---------- */
  #dossier{
    position:absolute; top:calc(var(--header-h) + 14px); right:0; bottom:0; z-index:4;
    width: min(340px, 88vw);
    padding: 20px 18px;
    display:flex; flex-direction:column; gap:16px;
    border-left: 1px solid var(--hair); border-radius:0;
    background: var(--panel-solid);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    transform: translateX(100%);
    transition: transform 0.32s cubic-bezier(.2,.8,.2,1);
    overflow-y:auto;
  }
  #dossier.open{ transform: translateX(0); }
  #dossier-close{
    position:absolute; top:14px; right:14px;
    width:28px; height:28px; border-radius:50%; border:1px solid var(--hair);
    background:none; color: var(--silver-dim); font-size:14px;
    display:flex; align-items:center; justify-content:center;
  }
  #dossier-close:hover{ color: var(--ink); border-color: var(--hair-strong); }
  .dossier-eyebrow{
    font-family: var(--font-mono); font-size:10.5px; letter-spacing:1px;
    color: var(--silver-faint); text-transform:uppercase;
  }
  #dossier-name{
    font-family: var(--font-display); font-weight:700; font-size:24px;
    color: var(--ink); word-break:break-word; padding-right:30px;
  }
  #dossier-territory{ display:flex; align-items:center; gap:8px; font-size:13px; }
  #dossier-territory .dot{ width:9px; height:9px; border-radius:50%; }
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:1px; background: var(--hair); border:1px solid var(--hair); border-radius:10px; overflow:hidden; }
  .stat-cell{ background: var(--void-2); padding:10px 12px; }
  .stat-cell .k{ font-size:9.5px; letter-spacing:0.8px; text-transform:uppercase; color: var(--silver-faint); font-family: var(--font-mono); }
  .stat-cell .v{ font-family: var(--font-mono); font-size:17px; color: var(--ink); margin-top:3px; font-variant-numeric: tabular-nums; }
  #dossier-note{
    font-size:12px; line-height:1.5; color: var(--silver-dim);
    background: rgba(199,215,224,0.05); border:1px solid var(--hair); border-radius:8px; padding:10px 12px;
  }
  #dossier-note b{ color: var(--silver); }
  .section-label{
    font-family: var(--font-display); font-weight:700; font-size:10.5px;
    letter-spacing:1.6px; text-transform:uppercase; color: var(--silver-dim);
    margin-top:2px;
  }
  #dossier-neighbors{ display:flex; flex-direction:column; gap:2px; }
  .neighbor-row{
    display:flex; align-items:center; gap:9px;
    padding:7px 8px; border-radius:8px; background:none; border:none; width:100%; text-align:left;
  }
  .neighbor-row:hover{ background: rgba(199,215,224,0.07); }
  .neighbor-dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .neighbor-name{ flex:1; font-size:12.5px; color: var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .neighbor-w{ font-family: var(--font-mono); font-size:10.5px; color: var(--silver-faint); font-variant-numeric: tabular-nums; }
  #dossier-ig{
    display:flex; align-items:center; justify-content:center; gap:7px;
    padding:10px; border-radius:9px; border:1px solid var(--hair-strong);
    font-size:12.5px; font-weight:600; color: var(--ink); text-decoration:none;
    margin-top:auto;
  }
  #dossier-ig:hover{ background: rgba(199,215,224,0.06); }

  /* ---------- territory focus banner ---------- */
  #territory-banner{
    position:absolute; left:50%; top:calc(var(--header-h) + 12px); transform:translateX(-50%);
    z-index:6; max-width: min(520px, 84vw);
    padding:14px 18px; display:none; gap:6px; flex-direction:column;
    pointer-events:auto;
  }
  #territory-banner.open{ display:flex; }
  #tb-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  #tb-name{ font-family: var(--font-display); font-weight:700; font-size:15px; }
  #tb-close{ background:none; border:none; color: var(--silver-dim); font-size:14px; flex:none; }
  #tb-close:hover{ color: var(--ink); }
  #tb-blurb{ font-size:12.5px; line-height:1.5; color: var(--silver-dim); }

  /* ---------- intro hint ---------- */
  #hint{
    position:absolute; left:50%; bottom:26px; transform:translateX(-50%);
    z-index:9; padding:10px 18px; border-radius:99px;
    font-size:12px; color: var(--silver-dim); display:flex; gap:14px; align-items:center;
    opacity:0; animation: hint-in 0.6s ease 0.4s forwards;
    pointer-events:none;
  }
  #hint.hide{ animation: hint-out 0.5s ease forwards; }
  #hint kbd{ font-family: var(--font-mono); color: var(--silver); }
  @keyframes hint-in{ from{ opacity:0; transform:translate(-50%,8px);} to{ opacity:1; transform:translate(-50%,0);} }
  @keyframes hint-out{ to{ opacity:0; } }

  /* ---------- mobile drawer toggle ---------- */
  #legend-toggle, #bw-toggle{ display:none; }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--hair-strong); border-radius:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  @media (prefers-reduced-motion: reduce){
    #dossier{ transition:none; }
    #hint{ animation:none; opacity:1; }
  }

  /* ================= responsive: narrow / touch ================= */
  @media (max-width: 760px){
    #hud-top{ flex-direction:column; padding:14px; gap:10px; }
    #top-right-controls{ width:100%; align-items:stretch; flex-direction:row; justify-content:space-between; }
    #search-wrap{ width:100%; flex:1; }
    #zoom-controls{ flex-direction:row; }
    #reset-view{ display:none; }

    #legend{
      left:0; right:0; bottom:0; width:100%;
      border-radius: 18px 18px 0 0; border-bottom:none;
      max-height: 40vh; overflow-y:auto;
      transform: translateY(calc(100% - 46px));
      transition: transform 0.3s ease;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
    }
    #legend.expanded{ transform: translateY(0); }
    #legend-head{ cursor:pointer; }
    #brandwatch{ display:none; }
    #bw-toggle{
      display:flex; position:absolute; right:14px; bottom:20px; z-index:6;
      padding:9px 14px; border-radius:99px; align-items:center; gap:6px;
      font-size:11.5px; font-family: var(--font-mono); color: var(--silver);
      pointer-events:auto;
    }
    #brandwatch.expanded{
      display:flex; flex-direction:column;
      position:absolute; left:14px; right:14px; bottom:64px; width:auto; z-index:7;
    }
    #dossier{ width:100%; left:0; right:0; top:auto; height:70vh; border-left:none;
      border-top:1px solid var(--hair); border-radius: 18px 18px 0 0;
      transform: translateY(100%);
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }
    #dossier.open{ transform: translateY(0); }
    #hint{
      bottom: 62px; font-size:10.5px; padding:8px 12px; flex-direction:column; gap:4px;
      text-align:center;
    }
    h1{ font-size:19px; }
    .kicker{ font-size:9.5px; letter-spacing:1.6px; }
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="bg-canvas"></canvas>
  <canvas id="atlas-canvas"></canvas>
</div>

<div id="hud-top">
  <div id="brand">
    <a href="/" aria-label="Bad Brain home"><img id="brand-logo" alt="Bad Brain" src=""></a>
    <div id="brand-text">
      <span class="kicker">Audience Atlas — Emirates Pilot</span>
      <div id="title-row"><h1>The Universe</h1></div>
      <span id="stat-line">n = 1,375 people · 1,200 accounts · 15,629 connections</span>
    </div>
  </div>
  <div id="top-right-controls">
    <div id="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" type="text" placeholder="Search an account…" autocomplete="off" aria-label="Search accounts">
      <div id="search-results" class="glass" role="listbox"></div>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
      <button id="reset-view" title="Reset view">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 3 6.7"/><polyline points="3 21 3 15 9 15"/></svg>
        RESET
      </button>
      <div id="zoom-controls" class="glass">
        <button id="zoom-in" aria-label="Zoom in">+</button>
        <button id="zoom-out" aria-label="Zoom out">–</button>
      </div>
    </div>
  </div>
</div>

<div id="territory-banner" class="glass">
  <div id="tb-top">
    <span id="tb-name"></span>
    <button id="tb-close" aria-label="Close territory focus">✕</button>
  </div>
  <span id="tb-blurb"></span>
</div>

<div id="tooltip" class="glass"></div>

<div id="legend" class="glass">
  <div id="legend-head">
    <span>Territories</span>
    <button id="legend-all">show all</button>
  </div>
  <div id="legend-rows"></div>
</div>

<button id="legend-toggle" class="glass" aria-label="Toggle territory legend"></button>

<div id="brandwatch" class="glass">
  <div id="bw-head">Brand watch</div>
  <div id="bw-rows"></div>
</div>
<button id="bw-toggle" class="glass">Brand watch ▲</button>

<div id="hint">
  <span><kbd>drag</kbd> to pan</span>
  <span><kbd>scroll / pinch</kbd> to zoom</span>
  <span><kbd>tap a star</kbd> to open its file</span>
</div>

<aside id="dossier">
  <button id="dossier-close" aria-label="Close">✕</button>
  <div>
    <div class="dossier-eyebrow" id="dossier-eyebrow">Account</div>
    <div id="dossier-name">@handle</div>
  </div>
  <div id="dossier-territory"><span class="dot"></span><span id="dossier-territory-name"></span></div>
  <div class="stat-grid">
    <div class="stat-cell"><div class="k">Prevalence</div><div class="v" id="dossier-pct">—</div></div>
    <div class="stat-cell"><div class="k">Followed by</div><div class="v" id="dossier-count">—</div></div>
  </div>
  <div id="dossier-note" style="display:none;"></div>
  <div>
    <div class="section-label">Strongest connections</div>
    <div id="dossier-neighbors"></div>
  </div>
  <a id="dossier-ig" href="#" target="_blank" rel="noopener noreferrer">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1"/></svg>
    View on Instagram

  /* adjacency: idx -> [[otherIdx, weight], ...] sorted desc by weight */
  var ADJ = new Array(N);
  for (var i=0;i<N;i++) ADJ[i] = [];
  EDGES.forEach(function(e){
    ADJ[e[0]].push([e[1], e[2]]);
    ADJ[e[1]].push([e[0], e[2]]);
  });
  for (var i2=0;i2<N;i2++) ADJ[i2].sort(function(a,b){ return b[1]-a[1]; });

  var USERNAME_INDEX = {};
  NODES.forEach(function(n, idx){ USERNAME_INDEX[n[0]] = idx; });

  /* prevalence range for radius scaling */
  var pMin = Infinity, pMax = -Infinity;
  NODES.forEach(function(n){ if(n[4]<pMin)pMin=n[4]; if(n[4]>pMax)pMax=n[4]; });
  function radiusFor(count){
    var t = Math.sqrt((count - pMin) / (pMax - pMin + 1e-9));
    return 2.6 + t * 13.5; // world-space px at scale=1
  }

  /* ---------------------------------------------------------------- dom */
  var bgCanvas = document.getElementById('bg-canvas');
  var canvas = document.getElementById('atlas-canvas');
  var ctx = canvas.getContext('2d');
  var bgCtx = bgCanvas.getContext('2d');
  var DPR = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
  var W=0, H=0;

  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var coarsePointer = window.matchMedia('(pointer: coarse)').matches;
  if (coarsePointer) document.body.classList.add('touch');

  var hudTop = document.getElementById('hud-top');
  function syncHeaderHeight(){
    var h = hudTop.getBoundingClientRect().height;
    document.documentElement.style.setProperty('--header-h', Math.ceil(h)+'px');
  }

  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    syncHeaderHeight();
    [canvas, bgCanvas].forEach(function(c){
      c.width = W*DPR; c.height = H*DPR;
      c.style.width = W+'px'; c.style.height = H+'px';
    });
    ctx.setTransform(DPR,0,0,DPR,0,0);
    bgCtx.setTransform(DPR,0,0,DPR,0,0);
    drawBg();
    requestDraw();
  }

  /* ---------------------------------------------------------------- camera */
  var world = { minX:0, maxX:1000, minY:0, maxY:1000 };
  var cam = { x:0, y:0, scale:1 }; // offset (screen = world*scale + offset)
  var MIN_SCALE=0.35, MAX_SCALE=9;

  function fitView(padPx, boundsOverride, animate){
    var b = boundsOverride || world;
    var w = Math.max(1, b.maxX-b.minX), h = Math.max(1, b.maxY-b.minY);
    var pad = padPx===undefined?70:padPx;
    var sx = (W-pad*2)/w, sy = (H-pad*2)/h;
    var s = Math.min(sx, sy);
    s = Math.max(MIN_SCALE, Math.min(MAX_SCALE, s));
    var cx = (b.minX+b.maxX)/2, cy=(b.minY+b.maxY)/2;
    var target = { x: W/2 - cx*s, y: H/2 - cy*s, scale: s };
    if (animate) flyToCam(target); else { cam = target; requestDraw(); }
  }

  var flyAnim = null;
  function flyToCam(target, duration){
    duration = duration===undefined ? (reducedMotion?0:520) : duration;
    if (duration<=0){ cam = target; requestDraw(); return; }
    var start = {x:cam.x, y:cam.y, scale:cam.scale};
    var t0 = performance.now();
    if (flyAnim) cancelAnimationFrame(flyAnim);
    function step(t){
      var p = Math.min(1, (t-t0)/duration);
      var e = 1 - Math.pow(1-p, 3); // ease-out cubic
      cam.x = start.x + (target.x-start.x)*e;
      cam.y = start.y + (target.y-start.y)*e;
      cam.scale = start.scale + (target.scale-start.scale)*e;
      requestDraw();
      if (p<1) flyAnim = requestAnimationFrame(step);
    }
    flyAnim = requestAnimationFrame(step);
  }

  function worldToScreen(x,y){ return [x*cam.scale+cam.x, y*cam.scale+cam.y]; }
  function screenToWorld(x,y){ return [(x-cam.x)/cam.scale, (y-cam.y)/cam.scale]; }

  /* ---------------------------------------------------------------- glow sprites */
  var glowSprites = {};
  function buildGlowSprite(color){
    var size = 128, c = document.createElement('canvas');
    c.width=c.height=size;
    var g = c.getContext('2d');
    var grad = g.createRadialGradient(size/2,size/2,0, size/2,size/2,size/2);
    grad.addColorStop(0, color+'CC');
    grad.addColorStop(0.35, color+'55');
    grad.addColorStop(1, color+'00');
    g.fillStyle = grad;
    g.fillRect(0,0,size,size);
    return c;
  }
  ['0','1','2','3','4','5'].forEach(function(id){
    var col = getComputedColor('--c'+id);
    glowSprites[id] = buildGlowSprite(col);
  });
  function getComputedColor(varName){
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  }
  var CLUSTER_COLOR = {};
  CLUSTERS.forEach(function(c){ CLUSTER_COLOR[c.id] = c.color; });

  /* ---------------------------------------------------------------- starfield bg */
  var stars = [];
  function drawBg(){
    bgCtx.clearRect(0,0,W,H);
    bgCtx.fillStyle = '#05060A';
    bgCtx.fillRect(0,0,W,H);
    var vg = bgCtx.createRadialGradient(W*0.52,H*0.45,0, W*0.52,H*0.45, Math.max(W,H)*0.75);
    vg.addColorStop(0, 'rgba(20,26,36,0.9)');
    vg.addColorStop(1, 'rgba(5,6,10,1)');
    bgCtx.fillStyle = vg;
    bgCtx.fillRect(0,0,W,H);
    if (stars.length===0 || stars._w!==W || stars._h!==H){
      stars = [];
      var count = Math.round((W*H)/2200);
      for (var i=0;i<count;i++){
        stars.push({ x:Math.random()*W, y:Math.random()*H, r:[0.5,0.6,0.8,1.0,1.3][Math.floor(Math.random()*5)],
                     a:0.18+Math.random()*0.55, ph:Math.random()*Math.PI*2 });
      }
      stars._w=W; stars._h=H;
    }
    bgCtx.fillStyle = '#D2DEE6';
    for (var s=0;s<stars.length;s++){
      var st = stars[s];
      bgCtx.globalAlpha = st.a;
      bgCtx.beginPath(); bgCtx.arc(st.x, st.y, st.r, 0, Math.PI*2); bgCtx.fill();
    }
    bgCtx.globalAlpha = 1;
  }

  var twinkleT = 0;
  function tickTwinkle(){
    if (reducedMotion) return;
    twinkleT += 0.012;
    bgCtx.clearRect(0,0,W,H);
    drawBg();
    requestAnimationFrame(tickTwinkle);
  }

  /* ---------------------------------------------------------------- filters / state */
  var visibleCluster = {}; // cid -> bool, all true by default
  CLUSTERS.forEach(function(c){ visibleCluster[c.id]=true; });
  var hoveredIdx = -1;
  var selectedIdx = -1;
  var focusedCluster = -1;

  function isNodeVisible(idx){ return visibleCluster[NODES[idx][3]]; }

  /* ---------------------------------------------------------------- main draw */
  var drawRequested = false;
  function requestDraw(){
    if (drawRequested) return;
    drawRequested = true;
    requestAnimationFrame(function(){ drawRequested=false; draw(); });
  }

  var TOP_SET = null; // indices of top ~260 nodes by prevalence, for ambient edges
  (function buildTopSet(){
    var arr = NODES.map(function(n,i){ return [i, n[4]]; });
    arr.sort(function(a,b){ return b[1]-a[1]; });
    TOP_SET = new Set(arr.slice(0,260).map(function(a){return a[0];}));
  })();

  function draw(){
    ctx.clearRect(0,0,W,H);

    // ---- nebula wash per cluster centroid ----
    ctx.save();
    CLUSTERS.forEach(function(c){
      if (!visibleCluster[c.id]) return;
      var cen = clusterCentroidPx(c.id);
      if (!cen) return;
      var r = (90 + c.count*0.9) * cam.scale;
      var grad = ctx.createRadialGradient(cen[0],cen[1],0, cen[0],cen[1], Math.max(60,r));
      grad.addColorStop(0, c.color+'14');
      grad.addColorStop(1, c.color+'00');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(cen[0],cen[1], Math.max(60,r), 0, Math.PI*2); ctx.fill();
    });
    ctx.restore();

    // ---- ambient low-alpha edges among top nodes ----
    ctx.save();
    ctx.lineWidth = 1;
    for (var ei=0; ei<EDGES.length; ei++){
      var e = EDGES[ei];
      if (!TOP_SET.has(e[0]) || !TOP_SET.has(e[1])) continue;
      if (e[2] < 0.16) continue;
      if (!isNodeVisible(e[0]) || !isNodeVisible(e[1])) continue;
      var a = worldToScreen(NODES[e[0]][1], NODES[e[0]][2]);
      var b = worldToScreen(NODES[e[1]][1], NODES[e[1]][2]);
      var col = CLUSTER_COLOR[NODES[e[0]][3]];
      ctx.strokeStyle = col + '14';
      ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    }
    ctx.restore();

    // ---- highlighted edges (hover / select) ----
    var focusIdx = selectedIdx>=0 ? selectedIdx : hoveredIdx;
    if (focusIdx>=0){
      ctx.save();
      ctx.lineWidth = 1.6;
      var neighbors = ADJ[focusIdx].slice(0,10);
      var p0 = worldToScreen(NODES[focusIdx][1], NODES[focusIdx][2]);
      neighbors.forEach(function(nb){
        var p1 = worldToScreen(NODES[nb[0]][1], NODES[nb[0]][2]);
        var col = CLUSTER_COLOR[NODES[focusIdx][3]];
        var grad = ctx.createLinearGradient(p0[0],p0[1],p1[0],p1[1]);
        grad.addColorStop(0, col+'CC');
        grad.addColorStop(1, col+'10');
        ctx.strokeStyle = grad;
        ctx.beginPath(); ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p1[0],p1[1]); ctx.stroke();
      });
      ctx.restore();
    }

    // ---- glow layer ----
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i=0;i<N;i++){
      if (!isNodeVisible(i)) continue;
      var n = NODES[i];
      var p = worldToScreen(n[1], n[2]);
      if (p[0]<-40||p[0]>W+40||p[1]<-40||p[1]>H+40) continue;
      var r = radiusFor(n[4]) * cam.scale;
      var gr = r*3.4;
      var sprite = glowSprites[String(n[3])];
      var dim = (focusIdx>=0 && i!==focusIdx && !isNeighborOf(focusIdx,i)) ? 0.22 : 0.85;
      ctx.globalAlpha = dim;
      ctx.drawImage(sprite, p[0]-gr, p[1]-gr, gr*2, gr*2);
    }
    ctx.restore();

    // ---- node cores ----
    ctx.save();
    for (var j=0;j<N;j++){
      if (!isNodeVisible(j)) continue;
      var n2 = NODES[j];
      var p2 = worldToScreen(n2[1], n2[2]);
      if (p2[0]<-20||p2[0]>W+20||p2[1]<-20||p2[1]>H+20) continue;
      var r2 = Math.max(1.1, radiusFor(n2[4]) * cam.scale);
      var isFocus = j===focusIdx;
      var isNb = focusIdx>=0 && isNeighborOf(focusIdx,j);
      var alpha = (focusIdx>=0 && !isFocus && !isNb) ? 0.30 : 1;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = CLUSTER_COLOR[n2[3]];
      ctx.beginPath(); ctx.arc(p2[0],p2[1],r2,0,Math.PI*2); ctx.fill();
      if (isFocus){
        ctx.globalAlpha = 1;
        ctx.strokeStyle = '#F1F4F6';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(p2[0],p2[1], r2+4, 0, Math.PI*2); ctx.stroke();
      }
      if (r2>5.5 && alpha>0.5){
        ctx.globalAlpha = alpha*0.55;
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath(); ctx.arc(p2[0]-r2*0.32, p2[1]-r2*0.32, r2*0.28, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // ---- arsenal-style highlight ring for brands present on map ----
    BRANDS.forEach(function(b){
      if (!b.in_graph) return;
      var idx = USERNAME_INDEX[b.username];
      if (idx===undefined) return;
      var n3 = NODES[idx];
      if (!isNodeVisible(idx)) return;
      var p3 = worldToScreen(n3[1], n3[2]);
      var r3 = radiusFor(n3[4]) * cam.scale;
      ctx.save();
      ctx.globalAlpha = 0.85;
      ctx.strokeStyle = '#F1F4F6';
      ctx.lineWidth = 1.4;
      ctx.setLineDash([2,3]);
      ctx.beginPath(); ctx.arc(p3[0],p3[1], r3+7, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    });

    // ---- territory labels (only when zoomed out enough, or cluster focused) ----
    ctx.save();
    ctx.font = '700 13px "Space Grotesk", sans-serif';
    ctx.textAlign = 'center';
    CLUSTERS.forEach(function(c){
      if (!visibleCluster[c.id]) return;
      var cen = clusterLabelPx(c.id);
      if (!cen) return;
      if (cen[0]<-140||cen[0]>W+140||cen[1]<-60||cen[1]>H+60) return;
      // faint plate behind the label so it reads over dense node clusters
      var w1 = ctx.measureText(c.name.toUpperCase()).width;
      ctx.fillStyle = 'rgba(5,6,10,0.45)';
      ctx.fillRect(cen[0]-w1/2-8, cen[1]-30, w1+16, 44);
      ctx.globalAlpha = 0.95;
      ctx.fillStyle = c.color;
      ctx.fillText(c.name.toUpperCase(), cen[0], cen[1]-16);
      ctx.font = '500 10.5px "JetBrains Mono", monospace';
      ctx.fillStyle = 'rgba(199,215,224,0.75)';
      ctx.fillText(c.count + ' accounts', cen[0], cen[1]+2);
      ctx.font = '700 13px "Space Grotesk", sans-serif';
    });
    ctx.restore();

    // ---- selective username labels for large / focused nodes ----
    ctx.save();
    ctx.font = '600 11.5px "Manrope", sans-serif';
    ctx.textBaseline = 'middle';
    var labelCount = 0;
    var labelBudget = (coarsePointer && cam.scale < 1.3 && focusIdx<0) ? 0
      : (cam.scale>2.2 ? 999 : (cam.scale>1.1 ? 60 : 18));
    var order = [];
    for (var k=0;k<N;k++) order.push(k);
    order.sort(function(a,b){ return NODES[b][4]-NODES[a][4]; });
    var placed = [];
    function overlapsPlaced(bx){
      for (var pi=0;pi<placed.length;pi++){
        var pb = placed[pi];
        if (!(bx[2]<pb[0]||bx[0]>pb[2]||bx[3]<pb[1]||bx[1]>pb[3])) return true;
      }
      return false;
    }
    for (var oi=0; oi<order.length && labelCount<labelBudget; oi++){
      var ni = order[oi];
      if (!isNodeVisible(ni)) continue;
      var isFoc = ni===focusIdx || (focusIdx>=0 && isNeighborOf(focusIdx,ni));
      if (focusIdx>=0 && !isFoc) continue;
      var nn = NODES[ni];
      var pp = worldToScreen(nn[1], nn[2]);
      if (pp[0]<0||pp[0]>W||pp[1]<0||pp[1]>H) continue;
      var rr = radiusFor(nn[4])*cam.scale;
      var txt = '@'+nn[0];
      var tw = ctx.measureText(txt).width;
      var bx = [pp[0]+rr+5, pp[1]-8, pp[0]+rr+5+tw+4, pp[1]+8];
      if (overlapsPlaced(bx)) continue;
      placed.push(bx);
      ctx.fillStyle = focusIdx>=0 ? '#F1F4F6' : 'rgba(241,244,246,0.88)';
      ctx.fillText(txt, pp[0]+rr+6, pp[1]);
      labelCount++;
    }
    ctx.restore();
  }

  function isNeighborOf(focusIdx, j){
    if (focusIdx<0) return false;
    var nb = ADJ[focusIdx];
    for (var i=0;i<Math.min(10,nb.length);i++) if (nb[i][0]===j) return true;
    return false;
  }

  function clusterCentroidPx(cid){
    var c = clusterCentroidCache[cid];
    if (!c) return null;
    return worldToScreen(c[0], c[1]);
  }
  var clusterCentroidCache = {};   // true node-density centroid (used for the nebula wash)
  var clusterLabelAnchor = {};     // nudged-apart anchor (used for the territory text label)
  (function computeCentroids(){
    var sums = {};
    NODES.forEach(function(n){
      var c = n[3];
      if (!sums[c]) sums[c]=[0,0,0];
      sums[c][0]+=n[1]; sums[c][1]+=n[2]; sums[c][2]++;
    });
    Object.keys(sums).forEach(function(c){
      clusterCentroidCache[c] = [sums[c][0]/sums[c][2], sums[c][1]/sums[c][2]];
    });
    // push small/tight clusters outward from the map centre so their label
    // clears the denser neighboring clusters (mirrors the static-render logic)
    var pushOverride = { '4':0.30, '5':0.55 };
    var basePush = 0.16;
    var cx = (world.minX+world.maxX)/2, cy=(world.minY+world.maxY)/2;
    Object.keys(clusterCentroidCache).forEach(function(c){
      var m = clusterCentroidCache[c];
      var push = pushOverride[c]!==undefined ? pushOverride[c] : basePush;
      var ox = m[0] + (m[0]-cx)*push;
      var oy = m[1] + (m[1]-cy)*push;
      ox = Math.min(Math.max(ox, world.minX+60), world.maxX-60);
      oy = Math.min(Math.max(oy, world.minY+40), world.maxY-40);
      clusterLabelAnchor[c] = [ox, oy];
    });
  })();
  function clusterLabelPx(cid){
    var a = clusterLabelAnchor[cid];
    if (!a) return null;
    return worldToScreen(a[0], a[1]);
  }

  /* Several territories overlap heavily in the spring layout (a real finding —
     see the "supercontinent" note in the analysis) rather than sitting in a
     tidy corner of the map, so a raw min/max box barely zooms in at all for
     those. Trim to the dense 12th-88th percentile core of the territory's own
     members instead, so "locate" always frames where that territory actually
     concentrates. */
  function clusterBounds(cid){
    var xs=[], ys=[];
    NODES.forEach(function(n){ if (n[3]===cid){ xs.push(n[1]); ys.push(n[2]); } });
    if (xs.length===0) return null;
    xs.sort(function(a,b){return a-b;}); ys.sort(function(a,b){return a-b;});
    function pct(arr,p){ return arr[Math.min(arr.length-1, Math.floor(arr.length*p))]; }
    var minX=pct(xs,0.12), maxX=pct(xs,0.88), minY=pct(ys,0.12), maxY=pct(ys,0.88);
    var padW=Math.max((maxX-minX)*0.22, 60), padH=Math.max((maxY-minY)*0.22, 60);
    return { minX:minX-padW, maxX:maxX+padW, minY:minY-padH, maxY:maxY+padH };
  }

  /* ---------------------------------------------------------------- pointer / pan / zoom */
  var pointers = new Map();
  var dragLast = null;
  var dragMoved = 0;
  var pinchStartDist = null, pinchStartScale = null, pinchStartMid=null, pinchStartCam=null;

  canvas.addEventListener('pointerdown', function(e){
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    dragMoved = 0;
    if (pointers.size===1){
      dragLast = {x:e.clientX, y:e.clientY};
      canvas.classList.add('dragging');
    } else if (pointers.size===2){
      var pts = Array.from(pointers.values());
      pinchStartDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      pinchStartScale = cam.scale;
      pinchStartMid = {x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2};
      pinchStartCam = {x:cam.x, y:cam.y};
    }
  });

  canvas.addEventListener('pointermove', function(e){
    if (!pointers.has(e.pointerId)) {
      handleHover(e);
      return;
    }
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pointers.size===1 && dragLast){
      var dx = e.clientX-dragLast.x, dy = e.clientY-dragLast.y;
      dragMoved += Math.abs(dx)+Math.abs(dy);
      cam.x += dx; cam.y += dy;
      dragLast = {x:e.clientX, y:e.clientY};
      requestDraw();
    } else if (pointers.size===2 && pinchStartDist){
      var pts2 = Array.from(pointers.values());
      var dist = Math.hypot(pts2[0].x-pts2[1].x, pts2[0].y-pts2[1].y);
      var mid = {x:(pts2[0].x+pts2[1].x)/2, y:(pts2[0].y+pts2[1].y)/2};
      var newScale = clamp(pinchStartScale * (dist/pinchStartDist), MIN_SCALE, MAX_SCALE);
      var wp = screenToWorld(pinchStartMid.x, pinchStartMid.y);
      cam.scale = newScale;
      cam.x = mid.x - wp[0]*newScale;
      cam.y = mid.y - wp[1]*newScale;
      requestDraw();
    }
  });

  function endPointer(e){
    pointers.delete(e.pointerId);
    if (pointers.size<2){ pinchStartDist=null; }
    if (pointers.size===0){
      canvas.classList.remove('dragging');
      if (dragMoved < 5){ handleClick(e); }
      dragLast = null;
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', function(){ hoveredIdx=-1; hideTooltip(); requestDraw(); });

  canvas.addEventListener('wheel', function(e){
    e.preventDefault();
    var delta = -e.deltaY * (e.deltaMode===1?18:1);
    var factor = Math.exp(delta*0.0012);
    var newScale = clamp(cam.scale*factor, MIN_SCALE, MAX_SCALE);
    var wp = screenToWorld(e.clientX, e.clientY);
    cam.scale = newScale;
    cam.x = e.clientX - wp[0]*newScale;
    cam.y = e.clientY - wp[1]*newScale;
    requestDraw();
  }, {passive:false});

  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

  function nearestNode(clientX, clientY, pad){
    var best=-1, bestD=Infinity;
    for (var i=0;i<N;i++){
      if (!isNodeVisible(i)) continue;
      var n = NODES[i];
      var p = worldToScreen(n[1], n[2]);
      var r = radiusFor(n[4])*cam.scale + (pad||6);
      var dx=p[0]-clientX, dy=p[1]-clientY;
      var d = dx*dx+dy*dy;
      if (d <= r*r && d<bestD){ bestD=d; best=i; }
    }
    return best;
  }

  var hoverPad = coarsePointer ? 14 : 7;
  function handleHover(e){
    if (coarsePointer) return; // no ghost hover on touch
    var rect = canvas.getBoundingClientRect();
    var idx = nearestNode(e.clientX-rect.left, e.clientY-rect.top, hoverPad);
    if (idx!==hoveredIdx){
      hoveredIdx = idx;
      requestDraw();
    }
    if (idx>=0){ showTooltip(e.clientX, e.clientY, idx); }
    else hideTooltip();
  }

  function handleClick(e){
    var rect = canvas.getBoundingClientRect();
    var cx = (e.clientX!==undefined?e.clientX:e.clientX) - rect.left;
    var cy = (e.clientY!==undefined?e.clientY:e.clientY) - rect.top;
    var idx = nearestNode(cx, cy, coarsePointer?16:8);
    if (idx>=0) selectNode(idx, false);
    else closeDossier();
  }

  /* ---------------------------------------------------------------- tooltip */
  var tooltipEl = document.getElementById('tooltip');
  function showTooltip(clientX, clientY, idx){
    var n = NODES[idx];
    var c = CLUSTER_BY_ID[n[3]];
    tooltipEl.innerHTML = '<b>@'+escapeHtml(n[0])+'</b><span>'+n[5]+'% · '+c.name+'</span>';
    tooltipEl.style.display = 'block';
    tooltipEl.style.left = clientX+'px';
    tooltipEl.style.top = clientY+'px';
  }
  function hideTooltip(){ tooltipEl.style.display='none'; }

  /* ---------------------------------------------------------------- dossier */
  var dossier = document.getElementById('dossier');
  function selectNode(idx, fly){
    selectedIdx = idx;
    focusedCluster = -1;
    closeBanner();
    var n = NODES[idx];
    var c = CLUSTER_BY_ID[n[3]];
    document.getElementById('dossier-eyebrow').textContent = 'Account';
    document.getElementById('dossier-name').textContent = '@'+n[0];
    document.getElementById('dossier-territory-name').textContent = c.name;
    document.querySelector('#dossier-territory .dot').style.background = c.color;
    document.getElementById('dossier-pct').textContent = n[5]+'%';
    document.getElementById('dossier-count').textContent = n[4]+' of 1,375';

    var noteEl = document.getElementById('dossier-note');
    if (SEED_CREATORS[n[0]]){
      noteEl.style.display = 'block';
      noteEl.innerHTML = '<b>Seed creator.</b> Part of the sample was built by finding people who engage with this account — its prevalence here is inflated by that sampling design, not a pure cultural signal.';
    } else if (n[0]==='arsenal'){
      noteEl.style.display = 'block';
      noteEl.innerHTML = '<b>Emirates’ sponsorship asset.</b> The one Emirates-adjacent account with real reach in this audience. @emirates itself sits at 0.4% — below the map’s visibility threshold.';
    } else {
      noteEl.style.display = 'none';
    }

    var nbWrap = document.getElementById('dossier-neighbors');
    nbWrap.innerHTML = '';
    var neighbors = ADJ[idx].slice(0,8);
    if (neighbors.length===0){
      nbWrap.innerHTML = '<div style="font-size:12px;color:var(--silver-faint);padding:6px 8px;">No connections cleared the map’s threshold.</div>';
    }
    neighbors.forEach(function(nb){
      var nn = NODES[nb[0]];
      var nc = CLUSTER_BY_ID[nn[3]];
      var row = document.createElement('button');
      row.className = 'neighbor-row';
      row.innerHTML = '<span class="neighbor-dot" style="background:'+nc.color+'"></span>'+
                       '<span class="neighbor-name">@'+escapeHtml(nn[0])+'</span>'+
                       '<span class="neighbor-w">'+Math.round(nb[1]*100)+'%</span>';
      row.addEventListener('click', function(){ selectNode(nb[0], true); });
      nbWrap.appendChild(row);
    });

    document.getElementById('dossier-ig').href = 'https://www.instagram.com/'+encodeURIComponent(n[0])+'/';

    dossier.classList.add('open');
    document.getElementById('brandwatch').style.visibility = 'hidden';
    document.getElementById('bw-toggle').style.visibility = 'hidden';
    dismissHint();
    if (fly){
      var p = {minX:n[1]-90,maxX:n[1]+90,minY:n[2]-90,maxY:n[2]+90};
      fitView(160, p, true);
    }
    requestDraw();
  }
  function closeDossier(){
    selectedIdx = -1;
    dossier.classList.remove('open');
    document.getElementById('brandwatch').style.visibility = '';
    document.getElementById('bw-toggle').style.visibility = '';
    requestDraw();
  }
  document.getElementById('dossier-close').addEventListener('click', closeDossier);

  /* ---------------------------------------------------------------- territory banner */
  var banner = document.getElementById('territory-banner');
  function focusCluster(cid){
    var c = CLUSTER_BY_ID[cid];
    focusedCluster = cid;
    closeDossier();
    document.getElementById('tb-name').textContent = c.name.toUpperCase()+' · '+c.count+' accounts';
    document.getElementById('tb-name').style.color = c.color;
    document.getElementById('tb-blurb').textContent = c.blurb;
    banner.classList.add('open');
    var b = clusterBounds(cid);
    if (b) fitView(90, b, true);
    dismissHint();
  }
  function closeBanner(){ banner.classList.remove('open'); focusedCluster=-1; }
  document.getElementById('tb-close').addEventListener('click', closeBanner);

  /* ---------------------------------------------------------------- legend */
  var legendRows = document.getElementById('legend-rows');
  CLUSTERS.forEach(function(c){
    var item = document.createElement('div');
    item.className = 'legend-item';
    var row = document.createElement('button');
    row.className = 'legend-row';
    row.title = 'Show / hide this territory';
    row.innerHTML = '<span class="legend-dot" style="background:'+c.color+'; color:'+c.color+'"></span>'+
                     '<span class="legend-label">'+escapeHtml(c.name)+'</span>'+
                     '<span class="legend-count">'+c.count+'</span>';
    row.addEventListener('click', function(){
      visibleCluster[c.id] = !visibleCluster[c.id];
      row.classList.toggle('dim', !visibleCluster[c.id]);
      if (!visibleCluster[c.id] && focusedCluster===c.id) closeBanner();
      requestDraw();
    });
    var locate = document.createElement('button');
    locate.className = 'legend-locate';
    locate.title = 'Zoom to this territory';
    locate.setAttribute('aria-label', 'Zoom to '+c.name);
    locate.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>';
    locate.addEventListener('click', function(ev){
      ev.stopPropagation();
      if (!visibleCluster[c.id]){ visibleCluster[c.id]=true; row.classList.remove('dim'); }
      focusCluster(c.id);
    });
    item.appendChild(row);
    item.appendChild(locate);
    legendRows.appendChild(item);
  });
  document.getElementById('legend-all').addEventListener('click', function(){
    CLUSTERS.forEach(function(c){ visibleCluster[c.id]=true; });
    document.querySelectorAll('.legend-row').forEach(function(r){ r.classList.remove('dim'); });
    closeBanner(); closeDossier();
    fitView(70, world, true);
    requestDraw();
  });
  var legendHead = document.getElementById('legend-head');
  legendHead.addEventListener('click', function(){
    if (window.innerWidth<=760) document.getElementById('legend').classList.toggle('expanded');
  });

  /* ---------------------------------------------------------------- brand watch */
  var bwRows = document.getElementById('bw-rows');
  BRANDS.forEach(function(b){
    var row = document.createElement('button');
    row.className = 'bw-row' + (b.in_graph ? ' clickable' : '');
    var sub = b.in_graph ? CLUSTER_BY_ID[b.cluster_id].name : 'below visibility threshold';
    row.innerHTML = '<div class="bw-left"><div class="bw-name">@'+escapeHtml(b.username)+'</div><div class="bw-sub">'+escapeHtml(sub)+'</div></div>'+
                     '<div class="bw-pct'+(b.count===0?' zero':'')+'">'+b.pct+'%</div>';
    if (b.in_graph){
      row.addEventListener('click', function(){
        var idx = USERNAME_INDEX[b.username];
        if (idx!==undefined) selectNode(idx, true);
      });
    }
    bwRows.appendChild(row);
  });

  /* ---------------------------------------------------------------- search */
  var searchInput = document.getElementById('search');
  var searchResults = document.getElementById('search-results');
  searchInput.addEventListener('input', function(){
    var q = searchInput.value.trim().toLowerCase();
    searchResults.innerHTML = '';
    if (q.length===0){ searchResults.classList.remove('open'); return; }
    var matches = [];
    for (var i=0;i<N && matches.length<8;i++){
      if (NODES[i][0].indexOf(q)!==-1) matches.push(i);
    }
    matches.sort(function(a,b){ return NODES[b][4]-NODES[a][4]; });
    if (matches.length===0){
      searchResults.innerHTML = '<div style="padding:10px;font-size:12.5px;color:var(--silver-faint);">No accounts match “'+escapeHtml(q)+'”</div>';
    }
    matches.forEach(function(idx){
      var n = NODES[idx];
      var c = CLUSTER_BY_ID[n[3]];
      var row = document.createElement('button');
      row.className = 'result-row';
      row.setAttribute('role','option');
      row.innerHTML = '<span class="result-dot" style="background:'+c.color+'"></span>'+
                       '<span class="result-name">@'+escapeHtml(n[0])+'</span>'+
                       '<span class="result-pct">'+n[5]+'%</span>';
      row.addEventListener('click', function(){
        selectNode(idx, true);
        searchResults.classList.remove('open');
        searchInput.value = '@'+n[0];
      });
      searchResults.appendChild(row);
    });
    searchResults.classList.add('open');
  });
  document.addEventListener('click', function(e){
    if (!document.getElementById('search-wrap').contains(e.target)) searchResults.classList.remove('open');
  });
  searchInput.addEventListener('keydown', function(e){
    if (e.key==='Escape'){ searchInput.blur(); searchResults.classList.remove('open'); }
  });

  /* ---------------------------------------------------------------- zoom / reset controls */
  document.getElementById('zoom-in').addEventListener('click', function(){
    var target = {x:cam.x, y:cam.y, scale: clamp(cam.scale*1.4, MIN_SCALE, MAX_SCALE)};
    var wp = screenToWorld(W/2, H/2);
    target.x = W/2 - wp[0]*target.scale; target.y = H/2 - wp[1]*target.scale;
    flyToCam(target, 220);
  });
  document.getElementById('zoom-out').addEventListener('click', function(){
    var target = {x:cam.x, y:cam.y, scale: clamp(cam.scale/1.4, MIN_SCALE, MAX_SCALE)};
    var wp = screenToWorld(W/2, H/2);
    target.x = W/2 - wp[0]*target.scale; target.y = H/2 - wp[1]*target.scale;
    flyToCam(target, 220);
  });
  document.getElementById('reset-view').addEventListener('click', function(){
    closeDossier(); closeBanner();
    CLUSTERS.forEach(function(c){ visibleCluster[c.id]=true; });
    document.querySelectorAll('.legend-row').forEach(function(r){ r.classList.remove('dim'); });
    fitView(70, world, true);
  });

  /* ---------------------------------------------------------------- mobile drawers */
  var bwToggle = document.getElementById('bw-toggle');
  var bwPanel = document.getElementById('brandwatch');
  bwToggle.addEventListener('click', function(){
    bwPanel.classList.toggle('expanded');
    bwToggle.textContent = bwPanel.classList.contains('expanded') ? 'Brand watch ▼' : 'Brand watch ▲';
  });

  /* ---------------------------------------------------------------- hint */
  var hintEl = document.getElementById('hint');
  var hintDismissed = false;
  function dismissHint(){
    if (hintDismissed) return;
    hintDismissed = true;
    hintEl.classList.add('hide');
  }
  canvas.addEventListener('pointerdown', dismissHint, {once:true});
  setTimeout(dismissHint, 6500);

  /* ---------------------------------------------------------------- keyboard */
  document.addEventListener('keydown', function(e){
    if (e.key==='Escape'){ closeDossier(); closeBanner(); }
  });

  /* ---------------------------------------------------------------- util */
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ---------------------------------------------------------------- brand logo (embedded) */
  document.getElementById('brand-logo').src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAksAAABWCAYAAADfatJuAAAGBklEQVR4nO3dSVLkSgwA0KLjH4QtR+D+C47AlpvQC4IIml+Dhxyk1Hvb7qDSypRKTrvsywUAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAmONp9gAAoKq394/PLf/v9eXZ9/VEgg8Ag2xtjh7RPI0l2ADQWasm6RqNU38CDACd9GySftIw9fVn9gAAYEWjGqXRn1XR4U505YnRobPV6DzotTblM7Q3I6+s9z7+mz2AiO4tcAsRcpHPwFmapZ1+Fl6FFnKTz/Sy8m5tRZqlExRaWId8pqXXl+cnDdM63ODdyNv7x6fEgDXIZ+AnzVJjCiysQz5zxugdSjui/WiWOlBgYR3ymTNGNTAapb40S50osABcLn0bmdeX5yeNUn+aJYAHnPxwVuumRpM0ll/DdfT2/vFpMQPw7dp3wqNm3PfIfJolgA2c/NCLdRWfZmkxvS8XZEjqozHIcGyw19Z8iLT+1bFajsz36DlM1SwdDc6K9xvMOqZrnxuh8LSIx++/EeG4VrZSPkd7s/yR8cx6KOeM+RxZx0Ye35FLfL0//5qM9TpVs3TUKk9SjXoMM5983DMm339b0xTLKvncQ6u49Fz7UefOyVJ/met1iWbpcslbYLONeVTjNDIumqZ4suZzL71i0eo+rYxzJe/bGV2ve8yZRwcEtcLrFnodQ6RLkDBb73V55u+rY8y6zNr6c8vsLM1wpLtdMSlbnaFFiI2zzboiznmEnLgm6rjOkPv7RFgDLXeZ7CwFEmFx9XT2DLXlWM6KNh7qmXEpuvX/zWj142shUoxajaVMszR68vZ0s5W2ec/+SieSqOOqIHI+jxB17UUdV2tVjvOIVWNTolmKPHmRx9ZLxWOmjUonFrdEvWev2rxUO94tosakxbhS3bMUdSJ+i3YWGtHWa8lZ5pz9ssytfH4sy1y25qnudaRqljLYe/mt51jumf3wsi2ijYdaIn4JRsyJ6nVMw5TD2XnSLDWSJVnujfP730YVG0WGqKzL66LkbKQ6Rg2apZMyvbJh61gjPPBv9uffitXscdFXhEYgE3XsS5QmkvvOzJNm6YCMSRF1zBGLjLPWWqKtP24zV8xS4tdwrfmiXNPry/PTnrPW3uNhDPkMPGJn6aCzL130ZXtbli+vCJcraWPmy6AzEyvuubc+stVOzVIjmR6Fn22RjpBh3hhD45RDtDoW8ZaCmR7FItvJpmapsVEJk2mRPZK5yGRLePbJsDYzr8Gs4+a+iDfhn6VZ6qDlLlOWhZRZ9C9D5oq4a/x7LNF/eBB1XLR35JaUDOtDs9TRkbPSDIsGKrLLtF2EMcA1R/PYr+E621o0vPMK4ouQo5EbNnWstshr86xUO0tnJiJqAkcdF/S2Yj5XZT5YXZmdpT3P0GntViFRYOCYmWew8vZf4kEFqXaWVhKlwHitB1lFuT+nsijxX+l5PsRUrlmaVWB/3lQ2K3lXvp4M1KGWMVqZy3CVzbwEmYEzz7yiXVqvZNZLdNUyZtAsDTa6wCgsffnSnEv86zhSy6wPWil3GU7ycE2GZ+jAFiu+QUBuMpudJcLJcmlF4z2X+AOjlGmWPCxtu8px2vMQ0d5j4bbZ8bfTMdaR+Z69RlhLqstwmRf/zN2SPZ+dOcat3IuZ+LQjluyxp5ZZW7SWqlnimC0vAo1WXGY/QydaPIDHDZO8pRfNUiEKCZCdOsYMZe5Zmsn9DceIGxFZl1CPZglgI43SF3GgGs1SZ7+LiiKzj3gRhbUIdWmWOlJc24gax6jjoj1z/X9iQiWapQ4evb8oQ5GJNkbjYRZzndfouXPz+bo0Sw3teclj1AI860WVW4pMlJhFGQd9eWnrY1Hj83Puoo6RXDw64KQziTj7WUK/Xbu/KtL4Lpe5Y1J   /* ---------------------------------------------------------------- boot */
  window.addEventListener('resize', resize);
  resize();
  fitView(80, world, false);
  if (!reducedMotion) requestAnimationFrame(tickTwinkle);
  requestDraw();

})();
</script>
